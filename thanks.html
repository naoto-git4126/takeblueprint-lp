<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; frame-ancestors 'none';">
  <title>送信完了 | Takeblueprint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      background: #0f2a43;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 16px; }
    p { line-height: 1.9; color: rgba(255,255,255,0.85); margin-bottom: 24px; }
    a.back {
      display: inline-block;
      padding: 12px 32px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
    }
    a.back:hover { border-color: #fff; background: rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <div class="card">
    <h1>お問い合わせを受け付けました</h1>
    <p>
      ありがとうございます。内容を確認のうえ、<br>
      ご記入いただいたメールアドレス宛に<strong>通常2営業日以内</strong>にご返信します。
    </p>
    <a class="back" href="/">トップページへ戻る</a>
  </div>
</body>
</html>
