# contact 関数（Cloud Run）の自動デプロイ — 案A''（2026-08-20）
# 認証は WIF（キーレス・このリポ限定）。本番トークンはどのマシンにも置かない。
# main への push（functions/ 配下の変更時）＝ユーザーのリリース GO がトリガー。
# 環境変数（SENDER_USER 等）はサービス側に設定済みのものが引き継がれる（ここでは触らない）。
name: deploy-contact

on:
  push:
    branches: [main]
    paths: ["functions/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: deploy-contact

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy contact \
            --project=takeblueprint-web \
            --region=asia-northeast1 \
            --source=functions \
            --function=contact \
            --allow-unauthenticated \
            --max-instances=2 \
            --quiet
